services:
  - type: web
    name: silvally
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: NARRATIVE_LLM_API_KEY
        sync: false
      - key: NARRATIVE_LLM_BASE_URL
        sync: false
      - key: NARRATIVE_LLM_MODEL
        value: k-exaone_v2.5
      - key: NARRATIVE_LLM_TIMEOUT
        value: 20s
      - key: CORS_ALLOWED_ORIGINS
        sync: false
